name: habitloop
publish_to: none
description: A calm, beautifully minimal cross-platform habit tracker with admin tools.
version: 1.0.0+3

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  flutter_local_notifications: ^23.0.3
  flutter_timezone: ^5.1.1
  timezone: ^0.11.1
  shared_preferences: ^2.5.6
  google_fonts: ^9.0.0
  material_ui: ^1.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/art/brand_tile.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/art/launcher_icon.png
  min_sdk_android: 24

flutter_native_splash:
  color: "#FCFCF9"
  image: assets/art/launch_brand.png
  android_12:
    color: "#FCFCF9"
    image: assets/art/launch_brand_android12.png
  ios: true
  android: true
